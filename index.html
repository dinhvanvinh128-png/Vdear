<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gia Phả — Cây Phả Hệ Dòng Họ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🌳</span>
      <div>
        <h1>Gia Phả</h1>
        <p class="tagline">Cây phả hệ dòng họ</p>
      </div>
    </div>
    <div class="toolbar">
      <button id="btnAdd" class="btn btn-primary">➕ Thêm thành viên</button>
      <button id="btnImport" class="btn">📂 Nhập</button>
      <button id="btnExport" class="btn">💾 Xuất</button>
      <button id="btnSample" class="btn">✨ Dữ liệu mẫu</button>
      <button id="btnClear" class="btn btn-danger">🗑 Xóa hết</button>
      <input type="file" id="fileInput" accept="application/json" hidden />
    </div>
  </header>

  <main class="stage">
    <div id="treeContainer" class="tree-container">
      <div id="tree" class="tree"></div>
    </div>
    <div id="emptyState" class="empty-state">
      <div class="empty-card">
        <div class="empty-emoji">👪</div>
        <h2>Chưa có ai trong gia phả</h2>
        <p>Bắt đầu bằng cách thêm thành viên đầu tiên, hoặc tải dữ liệu mẫu để xem thử.</p>
        <div class="empty-actions">
          <button class="btn btn-primary" onclick="document.getElementById('btnAdd').click()">➕ Thêm thành viên</button>
          <button class="btn" onclick="document.getElementById('btnSample').click()">✨ Dùng dữ liệu mẫu</button>
        </div>
      </div>
    </div>
    <div class="zoom-controls">
      <button id="zoomOut" class="zoom-btn" title="Thu nhỏ">−</button>
      <button id="zoomReset" class="zoom-btn" title="Đặt lại">⊙</button>
      <button id="zoomIn" class="zoom-btn" title="Phóng to">+</button>
    </div>
  </main>

  <!-- Modal thêm/sửa thành viên -->
  <div id="modal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">Thêm thành viên</h3>
        <button id="modalClose" class="icon-btn">✕</button>
      </div>
      <form id="memberForm" class="modal-body">
        <input type="hidden" id="memberId" />
        <div class="field">
          <label for="fName">Họ và tên *</label>
          <input type="text" id="fName" required placeholder="Nguyễn Văn A" />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="fGender">Giới tính</label>
            <select id="fGender">
              <option value="male">Nam</option>
              <option value="female">Nữ</option>
              <option value="other">Khác</option>
            </select>
          </div>
          <div class="field">
            <label for="fBirth">Năm sinh</label>
            <input type="text" id="fBirth" placeholder="1950" />
          </div>
          <div class="field">
            <label for="fDeath">Năm mất</label>
            <input type="text" id="fDeath" placeholder="—" />
          </div>
        </div>
        <div class="field">
          <label for="fParent">Cha / Mẹ</label>
          <select id="fParent">
            <option value="">— Không (đời đầu tiên) —</option>
          </select>
        </div>
        <div class="field">
          <label for="fSpouse">Vợ / Chồng</label>
          <select id="fSpouse">
            <option value="">— Không —</option>
          </select>
        </div>
        <div class="field">
          <label for="fNote">Ghi chú</label>
          <textarea id="fNote" rows="2" placeholder="Nghề nghiệp, quê quán, ghi chú..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" id="btnDelete" class="btn btn-danger" hidden>Xóa thành viên</button>
          <span class="spacer"></span>
          <button type="button" id="btnCancel" class="btn">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
