<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Vdear">
  <!-- Two arms converging on one point, drawn as a single polygon so the vertex
       stays sharp. The arms are deliberately unequal in weight: a symmetric V is
       the default letterform, the uneven pair reads as two signals of different
       strength agreeing, which is what the product actually scores. Three points
       of detail at most, because the mark has to survive a 16px favicon. -->
  <path fill="#0A0906" d="M3 4 L16 27.5 L28 4 L24.2 4 L16 20 L7.2 4 Z"/>
</svg>
