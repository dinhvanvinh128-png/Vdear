<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LŪMEN // ÍNDEX</title>
<link href="https://db.onlinewebfonts.com/c/ca3d10781128664daddf89bf2e2d1305?family=Graphik+LCG+Regular+Regular" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<!--
  BẢN XEM THỬ — mở thẳng bằng trình duyệt, không cần cài gì.
  Cùng đúng cấu trúc và cùng đúng các con số với src/App.tsx, nhưng viết bằng
  CSS thường thay cho class Tailwind, để xem được mà không cần bước build.
  Nguồn thật vẫn là src/App.tsx.
-->
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow-x:hidden; }
.font-graphik { font-family:'Graphik LCG Regular Regular','Graphik LCG',sans-serif; }
.font-manrope { font-family:'Manrope',sans-serif; }

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes gridReveal{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
@keyframes gridRevealH{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
.anim-fade-up{opacity:0;animation:fadeUp .9s cubic-bezier(.16,1,.3,1) forwards}
.anim-fade-in{opacity:0;animation:fadeIn .8s cubic-bezier(.16,1,.3,1) forwards}
.anim-slide-left{opacity:0;animation:slideInLeft .8s cubic-bezier(.16,1,.3,1) forwards}
.anim-slide-right{opacity:0;animation:slideInRight .8s cubic-bezier(.16,1,.3,1) forwards}
.anim-scale-in{opacity:0;animation:scaleIn .7s cubic-bezier(.16,1,.3,1) forwards}
.anim-grid-v{opacity:0;transform-origin:top;animation:gridReveal 1.2s cubic-bezier(.16,1,.3,1) forwards}
.anim-grid-h{opacity:0;transform-origin:left;animation:gridRevealH 1.2s cubic-bezier(.16,1,.3,1) forwards}

section{position:relative;width:100%;height:100vh;overflow:hidden;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.layer{position:relative;z-index:10;width:100%;height:100%}

/* --- nav: gutter 20px, ≥768px thành 35px --- */
nav{position:absolute;top:0;left:0;width:100%;display:flex;align-items:center;padding:20px}
.navleft{display:flex;align-items:center;gap:40px}
.wordmark{color:#fff;font-size:18px;line-height:21px;white-space:nowrap}
.navlinks{display:none;align-items:center;gap:40px}
.navitem{display:flex;align-items:center;gap:3px}
.navnum{color:rgba(175,221,255,.8);font-size:13px;line-height:15.6px}
.navlabel{color:#fff;font-size:13px;line-height:15.6px;cursor:pointer;transition:color .15s}
.navlabel:hover{color:#AFDDFF}
.wallet{display:none;align-items:center;gap:12px;margin-left:auto}
.wallet span{color:#fff;font-size:13px;line-height:15.6px}
.wallet .wconn{color:#AFDDFF}
.wallet .status{margin-left:20px}
.chip{background:#AFDDFF;border-radius:3px;padding:2px 5px;color:#000;font-size:13px;line-height:15.6px}
.burger{margin-left:auto;position:relative;width:40px;height:40px;display:flex;align-items:center;
  justify-content:center;background:none;border:0;cursor:pointer}
.burger svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.5}

h1{color:#fff;font-weight:400;line-height:1em;position:absolute;
  font-size:32px;top:140px;left:20px;max-width:300px}

.gline-v{position:absolute;top:0;height:100%;width:1px;background:rgba(255,255,255,.04)}
.gline-h{position:absolute;left:0;width:100%;height:1px;background:rgba(255,255,255,.04)}
.plus{position:absolute}
.plus i{position:absolute;background:rgba(255,255,255,.7);transform:translate(-50%,-50%)}
.plus i.h{width:10px;height:1px}
.plus i.v{width:1px;height:10px}

.nodes{position:absolute;inset:0;pointer-events:none;display:none}
.sq{position:absolute;width:80px;height:80px;border:1px solid rgba(255,255,255,.8)}
.nodelabel{position:absolute}
.nodelabel span{color:#fff;font-size:13px;line-height:15.6px;white-space:nowrap}
.nodelabel p{color:rgba(255,255,255,.5);font-size:11px;line-height:14px;margin-top:4px}
.conn{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.bottom{position:absolute;bottom:20px;left:20px;right:20px;display:flex;flex-direction:column;
  align-items:flex-start;justify-content:space-between;gap:20px}
.cta{background:#AFDDFF;padding:10px 16px;display:flex;align-items:center;gap:10px;border:0;cursor:pointer;
  transition:background .15s}
.cta:hover{background:#c8e8ff}
.cta .star{color:#000;font-size:16px;line-height:1}
.cta .lbl{color:#000;font-size:12px;line-height:15.6px;text-transform:uppercase;letter-spacing:.025em}
.card{position:relative;max-width:280px;display:none}
.badge{color:#000;font-size:13px;line-height:15.6px;background:#AFDDFF;padding:2px 6px;display:inline-block;margin-bottom:10px}
.cardbody{position:relative;padding:20px}
.cardbody svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cardbody p{position:relative;color:#fff;font-size:13px;line-height:18px;margin-bottom:18px}
.cardbody a{position:relative;color:#AFDDFF;font-size:13px;line-height:15.6px;cursor:pointer;text-decoration:none}
.cardbody a:hover{text-decoration:underline}

@media (min-width:640px){
  h1{font-size:48px;top:160px;max-width:420px}
  .card{display:block}
}
@media (min-width:768px){
  nav{padding:27px 35px}
  .wordmark{font-size:21px}
  h1{font-size:68px;top:178px;left:35px;max-width:554px}
  .nodes{display:block}
  .bottom{bottom:35px;left:35px;right:35px;flex-direction:row;align-items:flex-end;gap:0}
  .cta{padding:12px 20px}
  .cta .lbl{font-size:13px}
}
@media (min-width:1024px){
  .navlinks{display:flex}
  .wallet{display:flex}
  .burger{display:none}
  .sq{width:100px;height:100px}
}
</style>
</head>
<body>
<section>
  <video class="anim-fade-in" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260813_115057_94c3699b-0fd1-4124-bcf3-3626bb8c1f77.mp4" autoplay muted loop playsinline></video>
  <div class="layer">
    <nav>
      <div class="navleft">
        <span class="font-graphik wordmark anim-fade-up" style="animation-delay:200ms">LŪMEN // ÍNDEX</span>
        <div class="navlinks font-manrope" id="navlinks"></div>
      </div>
      <div class="wallet font-manrope anim-slide-right" style="animation-delay:600ms">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/><path d="M18 12h.01"/></svg>
        <span>0x71...f4e2</span><span class="wconn">[ CONNECTED ]</span>
        <span class="status">STATUS:</span><span class="chip font-manrope">PRIME_MEMBER</span>
      </div>
      <button class="burger anim-fade-in" style="animation-delay:400ms" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
    </nav>

    <h1 class="font-graphik anim-fade-up" style="animation-delay:400ms">Liquid Assets. Luminous Returns.</h1>
    <div id="grid"></div>

    <div class="nodes font-manrope" id="nodes"></div>

    <div class="bottom">
      <button class="cta anim-fade-up" style="animation-delay:900ms">
        <span class="star">&#10022;</span><span class="lbl font-manrope">Explore Private Banking</span>
      </button>
      <div class="card font-manrope anim-slide-right" style="animation-delay:1100ms">
        <span class="badge">NOT A BANK — AN ECOSYSTEM</span>
        <div class="cardbody">
          <svg viewBox="0 0 280 168" preserveAspectRatio="none">
            <polygon points="0.5,0.5 279.5,0.5 279.5,167.5 30,167.5 0.5,137.5" fill="none" stroke="#AFDDFF" stroke-width="1" vector-effect="non-scaling-stroke"/>
          </svg>
          <p>Maps the complexity of modern finance with a partner that brings clarity and organic growth to your portfolio.</p>
          <a>VIEW_TRANSPARENCY_REPORT</a>
        </div>
      </div>
    </div>
  </div>
</section>
<script>
const NAV=[['01','ECOSYSTEM',350],['02','LIQUIDITY_POOLS',450],['03','LUMEN_INDEX',550],['04','GOVERNANCE',650]];
document.getElementById('navlinks').innerHTML = NAV.map(([n,l,d])=>
  `<div class="navitem anim-fade-up" style="animation-delay:${d}ms"><span class="navnum">${n}.</span><span class="navlabel">${l}</span></div>`).join('');

const V=['12.6%','37.5%','61.9%','86.2%'], H=['32.7%','71.4%'];
let g='';
V.forEach((left,i)=>{g+=`<div class="gline-v anim-grid-v" style="left:${left};animation-delay:${600+i*100}ms"></div>`;});
H.forEach((top,i)=>{g+=`<div class="gline-h anim-grid-h" style="top:${top};animation-delay:${800+i*150}ms"></div>`;});
H.forEach((top,hi)=>V.forEach((left,vi)=>{
  g+=`<div class="plus anim-scale-in" style="top:${top};left:${left};animation-delay:${1000+(hi*4+vi)*80}ms"><i class="h"></i><i class="v"></i></div>`;}));
document.getElementById('grid').innerHTML=g;

const LINES=[['38%','14%','52%','14%',1200],['52%','14%','60%','27%',1400],
             ['32%','58%','20%','74%',1500],['20%','74%','6%','74%',1700],
             ['78%','53%','63%','53%',1800],['63%','53%','50%','63%',2000]];
const SQ=[['27%','60%',1500],['58%','32%',1800],['63%','50%',2100]];
const LBL=[['11%','26%','anim-slide-left',1100,'[ CORE_ENTITY ]','Neural node processing real-time data streams.','160px'],
           ['76%','3%','anim-slide-left',1400,'[ LUMINOUS_INSIGHT ]','Deep-learning engine synthesizing raw inputs.','160px'],
           ['50%','78%','anim-slide-right',1700,'[ CONNECTIVITY ]','Latency-free transmission across distributed networks.','180px']];
let n='';
LINES.forEach(([x1,y1,x2,y2,d])=>{n+=`<svg class="conn anim-fade-in" style="animation-delay:${d}ms"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(255,255,255,0.25)" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>`;});
SQ.forEach(([top,left,d])=>{n+=`<div class="sq anim-scale-in" style="top:${top};left:${left};animation-delay:${d}ms"></div>`;});
LBL.forEach(([top,left,a,d,t,p,mw])=>{n+=`<div class="nodelabel ${a}" style="top:${top};left:${left};animation-delay:${d}ms"><span>${t}</span><p style="max-width:${mw}">${p}</p></div>`;});
document.getElementById('nodes').innerHTML=n;
</script>
</body>
</html>
